name: conga-dev
channels:
  - conda-forge
  - bioconda
dependencies:
  # Python
  - python=3.12

  # Core scientific stack
  - numpy>=1.26
  - scipy>=1.11
  - pandas>=2.1
  - matplotlib>=3.8
  
  # Single-cell analysis
  - scanpy>=1.10
  - anndata>=0.10
  
  # Machine learning
  - scikit-learn>=1.3
  - statsmodels>=0.14
  
  # Visualization
  - seaborn>=0.13
  
  # Graph analysis
  - python-igraph>=0.11
  - leidenalg>=0.10
  - louvain>=0.8
  
  # Performance
  - numba>=0.58
  - pytables>=3.9
  - joblib>=1.3
  
  # C++ compiler for tcrdist_cpp
  - cxx-compiler
  - make
  
  # Development tools
  - pytest>=7.4
  - pytest-cov>=4.1
  - black>=23.0
  - ipython>=8.18
  - jupyter>=1.0
  
  # Utilities
  - pyyaml>=6.0
  
  # For SVG to PNG conversion
  - imagemagick
  
  # Pip for editable install
  - pip>=23.0
