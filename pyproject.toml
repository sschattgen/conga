[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conga"
version = "0.2.0"
description = "Clonotype Neighbor Graph Analysis (CoNGA) for single-cell TCR/BCR-seq and RNA-seq data"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Phil Bradley", email = "pbradley@fredhutch.org"},
    {name = "Stefan Schattgen", email = "stefan.schattgen@stjude.org"},
]
maintainers = [
    {name = "Phil Bradley", email = "pbradley@fredhutch.org"},
    {name = "Stefan Schattgen", email = "stefan.schattgen@stjude.org"},
]
keywords = ["single-cell", "tcr-seq", "bcr-seq", "immunology", "bioinformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Natural Language :: English",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"

dependencies = [
    "scanpy>=1.10.0",
    "anndata>=0.10.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.0",
    "statsmodels>=0.14.0",
    "python-igraph>=0.11.0",
    "leidenalg>=0.10.0",
    "louvain>=0.8.0",
    "matplotlib>=3.8.0",
    "joblib>=1.3.0",
    "numba>=0.58.0",
    "tables>=3.9.0",
]

[project.optional-dependencies]
# Performance optimization
performance = [
    "faiss-cpu>=1.7.4",
    "fastcluster>=1.2.0",
]

# Batch integration
batch = [
    "bbknn>=1.6.0",
]

# Experimental scVI integration
scvi = [
    "scvi-tools>=1.1.0",
]

# Development dependencies
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.100.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "ipython>=8.18.0",
    "jupyter>=1.0.0",
]

# All optional dependencies
all = [
    "conga[performance,batch,scvi,dev]",
]

[project.urls]
Homepage = "https://github.com/phbradley/conga"
Repository = "https://github.com/phbradley/conga"
Documentation = "https://github.com/phbradley/conga/blob/master/README.md"
"Bug Tracker" = "https://github.com/phbradley/conga/issues"
Publication = "https://www.nature.com/articles/s41587-021-00989-2"

[project.scripts]
conga = "conga.cli:main"

[tool.setuptools]
packages = ["conga", "conga.tcrdist"]
include-package-data = true

[tool.setuptools.package-data]
conga = [
    "data/*.txt",
    "data/*.tsv",
    "data/prediction_models/*.sav",
    "data/metaconga/*.tsv",
    "tcrdist/db/*.tsv",
    "tcrdist/db/*.txt",
]

# Black formatting
[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# Ruff linting
[tool.ruff]
line-length = 120
target-version = "py312"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex (for scientific code)
    "B905",  # zip strict (not in 3.12)
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["conga"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# MyPy type checking
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Gradual typing for scientific code
ignore_missing_imports = true  # Many scientific packages lack stubs
